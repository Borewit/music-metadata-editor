name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: dist/
      - name: Import the compiled package
        run: node --input-type=module -e "import('./dist/index.js')"
      - run: npm test

  coverage:
    name: Test coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test-coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
